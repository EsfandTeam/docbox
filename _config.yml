title: DocBox
description: A registry of tested, executable knowledge for AI agents — and a trust layer for game engine development
url: "https://esfandteam.github.io"
baseurl: "/docbox"

# تم مستندات حرفه‌ای
remote_theme: just-the-docs/just-the-docs

# چیدمان مدرن: بدون سایدبار ویکی‌پدیایی — ناوبری از نوار بالایی
nav_enabled: false

# جستجوی داخلی
search_enabled: true
search:
  heading_level: 2
  previews: 2
  preview_words_before: 3
  preview_words_after: 3
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# پلاگین‌های مورد نیاز
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# ناوبری بالای سایت — برچسب‌های فارسی پیش‌فرض؛ اسکریپت در صفحات /en/
# برچسب‌ها و لینک‌ها را به انگلیسی برمی‌گرداند
aux_links:
  "دستورپخت‌ها": "/docbox/fa/"
  "درباره": "/docbox/about"
  "GitHub": "https://github.com/esfandteam/docbox"
  "English": "/docbox/en/"
aux_links_new_tab: false

# جزئیات UX
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

# فوتر سفارشی در _includes/footer_custom.html ساخته می‌شود
footer_content: ""

# خروجی تمیز
compress_html:
  clippings: all
  comments: all
  endings: all
  startings: []
  blanklines: false
