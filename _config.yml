title: DocBox
description: یک رجیستری از دانش اجرایی و تست‌شده برای Agentهای هوش مصنوعی
url: "https://esfandteam.github.io"
baseurl: "/docbox"

# تم مستندات حرفه‌ای
remote_theme: just-the-docs/just-the-docs

# چیدمان مدرن: بدون سایدبار ویکی‌پدیایی — ناوبری از نوار بالایی
nav_enabled: false

# جستجوی داخلی
search_enabled: true
search:
  heading_level: 2
  previews: 2
  preview_words_before: 3
  preview_words_after: 3
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# پلاگین‌های مورد نیاز
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# ناوبری بالای سایت
aux_links:
  "دستورپخت‌ها": "/docbox/fa/"
  "درباره": "/docbox/about.md"
  "GitHub": "https://github.com/esfandteam/docbox"
  "English": "/docbox/en/"
aux_links_new_tab: false

# جزئیات UX
heading_anchors: true
back_to_top: true
back_to_top_text: "بازگشت به بالا"
footer_content: "DocBox — لایه اعتماد برای Agentهای هوش مصنوعی · منتشرشده تحت مجوز MIT"

# خروجی تمیز
compress_html:
  clippings: all
  comments: all
  endings: all
  startings: []
  blanklines: false
