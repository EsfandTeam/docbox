title: DocBox
description: یک رجیستری از دانش اجرایی و تست‌شده برای Agentها
url: "https://esfandteam.github.io"
baseurl: "/docbox"

# فعال‌سازی تم حرفه‌ای مستندات
remote_theme: just-the-docs/just-the-docs

# فعال‌سازی جستجوی داخلی در سایت
search_enabled: true

# پلاگین‌های مورد نیاز برای لود کردن تم از راه دور
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# لینک‌های بالای منو برای تغییر زبان
aux_links:
  "🇮🇷 فارسی": "/docbox/fa/"
  "🇬🇧 English": "/docbox/en/"
aux_links_new_tab: false
